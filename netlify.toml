[build]
  # Injecte la clé web Firebase (variable MANGAWATCH_FB_WEB_API_KEY dans l’UI Netlify).
  command = "node scripts/inject-firebase-api-key.js"
  # Netlify servira les fichiers statiques depuis la racine
  publish = "."
  functions = "netlify/functions"

# Variables secrètes : Netlify compare leur valeur à la sortie du build ; ce fichier contient volontairement la clé (Base64 + atob).
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "js/firebase-config.js"

[[redirects]]
  # Rediriger la racine vers la page d'accueil
  from = "/"
  to = "/pages/acceuil.html"
  status = 200

[[redirects]]
  # Redirection pour /acceuil
  from = "/acceuil"
  to = "/pages/acceuil.html"
  status = 200

[[redirects]]
  # Redirection pour /home
  from = "/home"
  to = "/pages/acceuil.html"
  status = 200

# Headers pour la sécurité et les performances
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers spécifiques pour les fichiers statiques
# Même logique que le CSS : pas d’« immutable » 1 an sur le JS, sinon les mises à jour
# ne s’affichent pas en navigation normale (cache agressif) alors qu’elles apparaissent en privé.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Pas "immutable" 1 an : sinon les mises à jour CSS ne sont jamais vues sans changer l’URL.
# Le ?v= sur les <link> dans les HTML force un nouveau téléchargement après chaque bump.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/pages/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

