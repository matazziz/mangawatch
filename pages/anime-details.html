    <!-- Script pour charger l'avatar immédiatement et éviter le flash -->
    <script>
        (function() {
            try {
                const user = JSON.parse(localStorage.getItem('user') || 'null');
                if (user && user.email) {
                    const avatarKey = 'avatar_' + user.email;
                    let avatarUrl = null;
                    if (user.customAvatar) avatarUrl = user.customAvatar;
                    else if (user.avatar) avatarUrl = user.avatar;
                    else if (user.originalAvatar) avatarUrl = user.originalAvatar;
                    else if (user.picture) avatarUrl = user.picture;
                    else {
                        const storedAvatar = localStorage.getItem(avatarKey);
                        if (storedAvatar) avatarUrl = storedAvatar;
                    }
                    if (avatarUrl && avatarUrl !== '') {
                        const img = new Image();
                        img.src = avatarUrl;
                        function updateAvatarSrc() {
                            const avatarElement = document.getElementById('user-avatar');
                            if (avatarElement) avatarElement.src = avatarUrl;
                            else setTimeout(updateAvatarSrc, 10);
                        }
                        if (document.readyState === 'loading') {
                            document.addEventListener('DOMContentLoaded', updateAvatarSrc);
                        } else {
                            updateAvatarSrc();
                        }
                    }
                }
            } catch (e) {
                console.error('Erreur lors du préchargement de l\'avatar:', e);
            }
        })();
    </script>

    <script>
        // Initialiser la localisation et charger les détails
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 DOM chargé, initialisation...');
            
            if (window.localization) {
                window.localization.init();
            }
            
            // Charger les détails du contenu
            if (contentId) {
                console.log('📡 Chargement des détails pour le contenu ID:', contentId, 'type:', contentType);
                const loadPromise = loadContentDetails();
                if (loadPromise && typeof loadPromise.then === 'function') {
                    loadPromise.catch((error) => {
                        console.error('❌ Erreur lors du chargement:', error);
                    });
                }
            } else {
                console.log('⚠️ Aucun ID de contenu fourni');
            }
        });
        
        // Récupérer l'ID et le type depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const contentId = urlParams.get('id');
        const urlType = (urlParams.get('type') || '').toLowerCase();
        let contentType = urlType ||
            (window.MW_API_CONFIG?.getDefaultContentType?.() || 'anime');
        if (window.MW_API_CONFIG?.isMangaOnly?.()) {
            if (urlType === 'anime' || urlParams.get('season')) {
                contentType = 'anime';
            } else if (!urlType) {
                contentType = 'manga';
            }
        }
        
        // Informations de l'URL
        console.log('URL complète:', window.location.href);
        console.log('Paramètres URL:', Object.fromEntries(urlParams));
        console.log('ID contenu récupéré:', contentId);
        console.log('Type contenu:', contentType);
        
        // Fonction pour nettoyer le synopsis en supprimant les mentions MAL rewrite et limiter à 8 lignes
        function cleanSynopsis(synopsis) {
            if (!synopsis) return null;
            
            // Supprimer les variations de "écrit par MAL rewrite" dans différentes langues
            const malRewritePatterns = [
                /écrit par MAL rewrite/i,
                /written by MAL rewrite/i,
                /geschrieben von MAL rewrite/i,
                /escrito por MAL rewrite/i,
                /scritto da MAL rewrite/i,
                /MAL rewriteによって書かれた/i,
                /écrit par MAL/i,
                /written by MAL/i,
                /geschrieben von MAL/i,
                /escrito por MAL/i,
                /scritto da MAL/i,
                /MALによって書かれた/i
            ];
            
            let cleanedSynopsis = synopsis;
            malRewritePatterns.forEach(pattern => {
                cleanedSynopsis = cleanedSynopsis.replace(pattern, '');
            });
            
            // Supprimer les mentions de sources (Wikipedia, etc.) à la fin
            const sourcePatterns = [
                /\s*\(?\s*[Ss]ource\s*:?\s*[Ww]ikipedia[^)]*\)?\s*$/i,
                /\s*\(?\s*[Ss]ource\s*:?\s*[Ww]ikipedia\.org[^)]*\)?\s*$/i,
                /\s*\(?\s*[Ss]ource\s*:?\s*[Ww]ikipedia\.com[^)]*\)?\s*$/i,
                /\s*\(?\s*[Ss]ource\s*:?\s*[Ww]ikipedia\.fr[^)]*\)?\s*$/i,
                /\s*\(?\s*[Ss]ource\s*:?\s*[Ww]ikipedia\.en[^)]*\)?\s*$/i,
                /\s*\(?\s*[Ss]ource\s*:?\s*[Ww]ikipedia\.ja[^)]*\)?\s*$/i,
                /\s*\(?\s*[Ff]rom\s+[Ww]ikipedia[^)]*\)?\s*$/i,
                /\s*\(?\s*[Vv]ia\s+[Ww]ikipedia[^)]*\)?\s*$/i,
                /\s*\(?\s*[Ww]ikipedia[^)]*\)?\s*$/i,
                /\s*\[[Ss]ource\s*:?\s*[Ww]ikipedia[^\]]*\]\s*$/i,
                /\s*\[[Ww]ikipedia[^\]]*\]\s*$/i,
                /\s*\(?\s*[Ss]ource\s*:?\s*[^)]+\)?\s*$/i,  // Source générique à la fin
                /\s*\[[Ss]ource\s*:?\s*[^\]]+\]\s*$/i,  // Source générique entre crochets
            ];
            
            sourcePatterns.forEach(pattern => {
                cleanedSynopsis = cleanedSynopsis.replace(pattern, '');
            });
            
            // Nettoyer les espaces en trop et la ponctuation
            cleanedSynopsis = cleanedSynopsis.trim();
            
            // Supprimer les caractères résiduels à la fin
            const residualPatterns = [
                /[.,;:!?]+$/,  // Ponctuation finale
                /\[\s*\]$/,     // Crochets vides
                /\(\s*\)$/,     // Parenthèses vides
                /\{\s*\}$/,     // Accolades vides
                /\[\s*$/,       // Crochet ouvrant seul
                /\]\s*$/,       // Crochet fermant seul
                /\(\s*$/,       // Parenthèse ouvrante seule
                /\)\s*$/,       // Parenthèse fermante seule
                /\{\s*$/,       // Accolade ouvrante seule
                /\}\s*$/,       // Accolade fermante seule
                /\s+$/,         // Espaces multiples à la fin
                /^\s+/,         // Espaces multiples au début
            ];
            
            residualPatterns.forEach(pattern => {
                cleanedSynopsis = cleanedSynopsis.replace(pattern, '');
            });
            
            // Nettoyer à nouveau les espaces
            cleanedSynopsis = cleanedSynopsis.trim();
            
            // SUPPRIMÉ: Limitation à 10 lignes maximum - garder le synopsis complet
            // const lines = cleanedSynopsis.split('\n');
            // if (lines.length > 10) {
            //     cleanedSynopsis = lines.slice(0, 10).join('\n');
            //     
            //     // Chercher le dernier point dans les 10 premières lignes
            //     const lastPeriodIndex = cleanedSynopsis.lastIndexOf('.');
            //     if (lastPeriodIndex !== -1) {
            //         // Couper au dernier point trouvé
            //         cleanedSynopsis = cleanedSynopsis.substring(0, lastPeriodIndex + 1);
            //     }
            //     
            //     // Ajouter "..." à la fin pour indiquer qu'il y a plus de contenu
            //     cleanedSynopsis += '\n...';
            // }
            
            // S'assurer que le synopsis ne contient que du texte valide
            // Supprimer tous les caractères de contrôle sauf les retours à la ligne
            cleanedSynopsis = cleanedSynopsis.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
            
            // S'assurer qu'il n'y a pas de caractères qui pourraient être interprétés comme des balises HTML
            cleanedSynopsis = cleanedSynopsis.replace(/[<>]/g, '');
            
            // SUPPRIMÉ: Suppression des mots-clés de genres - garder le contenu original
            // const genreKeywords = ['Action', 'Aventure', 'Comédie', 'Drame', 'Fantasy', 'Horreur', 'Mystère', 'Romance', 'Sci-Fi', 'Slice of Life', 'Sport', 'Supernatural', 'Thriller'];
            // genreKeywords.forEach(keyword => {
            //     const regex = new RegExp(`\\b${keyword}\\b`, 'gi');
            //     cleanedSynopsis = cleanedSynopsis.replace(regex, '');
            // });
            
            // Nettoyer les espaces multiples qui pourraient rester (mais garder les retours à la ligne)
            cleanedSynopsis = cleanedSynopsis.replace(/[ \t]+/g, ' ').trim();
            
            return cleanedSynopsis;
        }
        
        // Fonction pour formater la date
        function formatDate(dateString) {
            if (!dateString) return 'Inconnue';
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('fr-FR', options);
        }
        
        // Fonction pour afficher les détails du contenu (anime ou manga)
        const MW_DEBUG_ENABLED = new URLSearchParams(window.location.search).get('debug') === '1' ||
            localStorage.getItem('mw_debug') === '1';
        function mwDebug(label, payload) {
            if (!MW_DEBUG_ENABLED) return;
            const ts = new Date().toISOString();
            if (typeof payload === 'undefined') {
                console.log(`[MW-DEBUG][${ts}] ${label}`);
            } else {
                console.log(`[MW-DEBUG][${ts}] ${label}`, payload);
            }
        }

        async function loadContentDetails() {
            return new Promise((resolve, reject) => {
                console.log('🔍 loadContentDetails appelé avec contentId:', contentId, 'type:', contentType);
                mwDebug('anime-details:start', {
                    href: window.location.href,
                    params: Object.fromEntries(urlParams),
                    contentId,
                    contentType
                });
                
                if (!contentId) {
                    console.log('❌ Aucun ID de contenu fourni');
                    document.getElementById('anime-details').innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-circle"></i>
                            <p data-i18n="no_content_selected">Aucun contenu sélectionné. Veuillez retourner au catalogue.</p>
                            <a href="manga-database.html" class="cta-button" onclick="returnToCatalogue(event)" data-i18n="back_to_catalogue">Retour au catalogue</a>
                        </div>
                    `;
                    reject(new Error('Aucun ID de contenu fourni'));
                    return;
                }
                
                const mediaType = window.MW_API_CONFIG?.getApiMediaType?.(contentType) ||
                    (contentType === 'manga' ? 'manga' : 'anime');
                const proxyUrl = `/.netlify/functions/jikan-proxy?action=detail&mediaType=${mediaType}&id=${encodeURIComponent(contentId)}`;
                const directUrl = `https://api.jikan.moe/v4/${mediaType}/${encodeURIComponent(contentId)}`;
                console.log('🌐 Chargement détails pour:', contentId, mediaType);
                const startedAt = performance.now();
                mwDebug('anime-details:request', { proxyUrl, directUrl });

                const prefetch = window.MWDetailCache?.getDetailPrefetch?.(contentId, contentType);
                let renderedFromCache = false;

                const applyDetailData = (data, source, options = {}) => {
                    const content = normalizeContentDetailsPayload(data, contentType);
                    if (!content) {
                        throw new Error(`Détails du ${contentType} non trouvés`);
                    }
                    const shouldRender = !window.__mwDetailDisplayed || options.refresh === true;
                    if (shouldRender) {
                        renderContentDetails(content);
                        renderedFromCache = true;
                        window.__mwDetailDisplayed = true;
                    }
                    return content;
                };

                if (prefetch?.data) {
                    try {
                        applyDetailData({ data: prefetch.data }, 'cache');
                        window.__mwDetailDisplayed = true;
                    } catch (cacheErr) {
                        console.warn('Prefetch invalide:', cacheErr);
                    }
                }

                const fetchDetailPayload = async () => {
                    if (window.MWDetailCache?.fetchAniListByMalId) {
                        const fromAniList = await window.MWDetailCache.fetchAniListByMalId(contentId, prefetch?.data?.title || '', mediaType);
                        if (fromAniList) {
                            return { data: fromAniList };
                        }
                    }

                    const doFetch = async () => {
                        const fetcher = window.MW_API_CONFIG?.fetchWithRetry?.bind(window.MW_API_CONFIG) || fetch;
                        let proxyResponse;
                        try {
                            proxyResponse = await fetcher(proxyUrl, { headers: { Accept: 'application/json' } });
                            if (proxyResponse.ok) {
                                return proxyResponse.json();
                            }
                            console.warn('Proxy indisponible, repli Jikan direct:', proxyResponse.status);
                        } catch (proxyError) {
                            console.warn('Proxy injoignable, repli Jikan direct:', proxyError);
                        }
                        if (window.MW_API_CONFIG?.isMangaOnly?.() && mediaType !== 'manga' && contentType !== 'anime' && contentType !== 'film') {
                            throw new Error('API anime indisponible (mode manga uniquement)');
                        }
                        const directResponse = await fetcher(directUrl, { headers: { Accept: 'application/json' } });
                        if (!directResponse.ok) {
                            throw new Error(`Erreur HTTP: ${directResponse.status} ${directResponse.statusText}`);
                        }
                        return directResponse.json();
                    };
                    if (window.MW_API_CONFIG?.enqueueJikan) {
                        return window.MW_API_CONFIG.enqueueJikan(doFetch);
                    }
                    return doFetch();
                };

                const fetchFallbackDetail = async () => {
                    const titleHint = prefetch?.data?.title || '';
                    if (window.MWDetailCache?.fetchAniListByMalId) {
                        const fromAni = await MWDetailCache.fetchAniListByMalId(contentId, titleHint, mediaType);
                        if (fromAni) return { data: fromAni };
                    }
                    if (prefetch?.data) return { data: prefetch.data };
                    return null;
                };

                fetchDetailPayload()
                    .then(data => {
                        console.log('📡 Réponse API reçue en', Math.round(performance.now() - startedAt), 'ms');
                        mwDebug('anime-details:response-meta', {
                            elapsedMs: Math.round(performance.now() - startedAt)
                        });
                        console.log('📦 Données API reçues:', data);
                        mwDebug('anime-details:payload', {
                            hasData: !!data?.data,
                            keys: data?.data ? Object.keys(data.data).slice(0, 25) : [],
                            genresCount: data?.data?.genres?.length || 0
                        });
                        
                        const content = applyDetailData(data, 'jikan', {
                            refresh: !!window.__mwDetailDisplayed
                        });
                        console.log('✅ Données contenu reçues:', content);
                        resolve(content);
                    })
                    .catch(async (error) => {
                        console.warn('AniList/Jikan indisponible, repli cache:', error?.message || error);
                        try {
                            const fallback = await fetchFallbackDetail();
                            if (fallback) {
                                const fbContent = applyDetailData(fallback, 'fallback', {
                                    refresh: !!window.__mwDetailDisplayed
                                });
                                window.__mwDetailDisplayed = true;
                                resolve(fbContent);
                                return;
                            }
                        } catch (fallbackErr) {
                            console.error('Repli échoué:', fallbackErr);
                        }
                        if (renderedFromCache || window.__mwDetailDisplayed) {
                            resolve(prefetch?.data || null);
                            return;
                        }
                        document.getElementById('anime-details').innerHTML = `
                            <div class="error-message">
                                <i class="fas fa-exclamation-triangle"></i>
                                <p data-i18n="load_error">Une erreur est survenue lors du chargement des détails du ${contentType}.</p>
                                <p>${error.message}</p>
                                <p style="font-size:0.9rem;opacity:0.85;">Rechargez la page ou revenez au catalogue si les details AniList sont temporairement indisponibles.</p>
                                <a href="manga-database.html" class="cta-button" onclick="returnToCatalogue(event)" data-i18n="back_to_catalogue">Retour au catalogue</a>
                            </div>
                        `;
                        reject(error);
                    });
            });
        }

        function normalizeContentDetailsPayload(data, mediaType) {
            if (data && data.data) return data.data; // compat Jikan historique
            if (data && data.mal_id) return data; // cache catalogue / AniList
            if (!data || !data.id) return null;

            const year = data.start_date ? new Date(data.start_date).getFullYear() : null;
            const image = data.main_picture?.large || data.main_picture?.medium || '';
            return {
                mal_id: data.id,
                title: data.title || 'Sans titre',
                title_english: data.alternative_titles?.en || null,
                images: {
                    jpg: {
                        large_image_url: image,
                        image_url: image
                    }
                },
                synopsis: data.synopsis || 'Synopsis indisponible.',
                score: data.mean || null,
                popularity: data.popularity || 0,
                rank: data.rank || null,
                status: data.status || null,
                type: data.media_type || (mediaType === 'anime' ? 'TV' : 'Manga'),
                episodes: data.num_episodes || null,
                volumes: data.num_volumes || null,
                chapters: data.num_chapters || null,
                genres: (data.genres || []).map(g => ({ name: g.name })),
                published: { prop: { from: { year } } },
                aired: { prop: { from: { year } } },
                trailer: null,
                studios: (data.studios || []).map(s => ({ name: s.name })),
                background: data.background || null
            };
        }
        
        // Fonction helper pour obtenir le type traduit
        function getTranslatedType(contentType, itemType) {
            function t(key, fallback = key) {
                if (window.localization) {
                    const translation = window.localization.get(key);
                    return translation !== key ? translation : fallback;
                }
                return fallback;
            }
            
            if (contentType === 'anime' || contentType === 'film') {
                if (itemType === 'Movie') {
                    return t('collection.type.film', t('search.type.movie', 'Film'));
                } else {
                    return t('collection.type.anime', 'Anime');
                }
            } else {
                // Pour les mangas - mapper les types de l'API vers les clés de traduction
                const typeMap = {
                    'Manga': 'collection.type.manga',
                    'Novel': 'collection.type.novel',
                    'Light Novel': 'collection.type.novel',
                    'One Shot': 'collection.type.manga',
                    'Doujinshi': 'collection.type.doujin',
                    'Doujin': 'collection.type.doujin',
                    'Manhwa': 'collection.type.manhwa',
                    'Manhua': 'collection.type.manhua'
                };
                
                const translationKey = typeMap[itemType];
                if (translationKey) {
                    return t(translationKey, itemType);
                }
                
                return itemType || t(`collection.type.${contentType}`, contentType);
            }
        }

        // Fonction pour afficher les détails du contenu dans le DOM
        function renderContentDetails(content) {
            // Stocker les données du contenu globalement
            contentData = content;
            
            // Détecter le contentType réel à partir de content.type de l'API
            let detectedContentType = urlParams.get('type')
                || (urlParams.get('season') ? 'anime' : null)
                || contentType
                || 'anime';
            
            if (content && content.type) {
                const apiType = content.type.toLowerCase();
                
                // Mapper les types de l'API vers les types internes
                if (apiType === 'doujinshi' || apiType.includes('doujin')) {
                    detectedContentType = 'doujin';

                    </ul>
                </div>
            `;
            
            // Initialiser le système de notation avec un délai pour s'assurer que le DOM est prêt
            setTimeout(() => {

                const starsContainer = document.querySelector('.rating-stars');
                if (starsContainer) {

            // Traduire les valeurs des informations générales

            // Traduire le synopsis
            if (currentLanguage !== 'en' && content.synopsis) {

            // Autres saisons / volumes de la même série
            if (window.DetailsRelatedSeasons?.loadAndRender) {

                }
            }
        }
        
        // Variable globale pour stocker les données du contenu
        let contentData = null;
        
        // Variable globale pour stocker la note actuelle
        let currentRating = null;
        let hoveredRating = null; // Variable pour suivre la note survolée
        
        // Fonction helper pour obtenir une traduction (accessible globalement dans le script)
        function getRatingTranslation(key, fallback = key) {
            if (window.localization) {
                const translation = window.localization.get(key);
                return translation !== key ? translation : fallback;
            }
            return fallback;
        }
        
        // Fonction pour initialiser le système de notation
        function initializeRating(animeId) {
            const starsContainer = document.querySelector('.rating-stars');
            const ratingText = document.querySelector('.rating-text');
            const clearBtn = document.querySelector('.clear-rating-btn');
            
            console.log('Éléments trouvés:', {
                starsContainer: !!starsContainer,
                ratingText: !!ratingText,
                clearBtn: !!clearBtn
            });
            
            if (!starsContainer) {
                console.log('Container d\'étoiles non trouvé, arrêt de l\'initialisation');
                return;
            }
            
            // Si contentData n'est pas encore disponible, on peut quand même chercher la note
            // en utilisant le contentType de l'URL, et on trouvera la note par ID si elle existe
            // La recherche par ID garantit qu'on trouvera la note même si le contentType diffère
            
            // Détecter le contentType de la même manière que dans saveRating
            let detectedContentType = contentType; // Utiliser le type de l'URL par défaut
            
            if (contentData && contentData.type) {
                const apiType = contentData.type.toLowerCase();
                
                // Mapper les types de l'API vers les types internes (même logique que saveRating)
                if (apiType === 'doujinshi' || apiType.includes('doujin')) {
                    detectedContentType = 'doujin';
                } else if (apiType === 'manhwa' || apiType.includes('manhwa')) {
                    detectedContentType = 'manhwa';
                } else if (apiType === 'manhua' || apiType.includes('manhua')) {
                    detectedContentType = 'manhua';
                } else if (apiType === 'novel' || apiType === 'light novel' || apiType.includes('novel')) {
                    detectedContentType = 'roman';
                } else if (apiType === 'movie') {
                    detectedContentType = 'film';
                } else if (apiType === 'manga' || apiType.includes('manga')) {
                    detectedContentType = 'manga';
                }
            }
            
            // Détection supplémentaire basée sur le titre et les genres si le type API n'est pas spécifique
            if (contentData) {
                const animeTitle = (contentData.title || '').toLowerCase();
                const genres = contentData.genres?.map(g => g.name) || [];
                const genresStr = genres.join(' ').toLowerCase();
                
                // Si le type détecté est toujours "manga" mais qu'on détecte des indices de doujin
                if (detectedContentType === 'manga' && (
                    animeTitle.includes('doujin') ||
                    animeTitle.includes('totally captivated') ||
                    animeTitle.includes('hentai') ||
                    genresStr.includes('erotica') ||
                    genresStr.includes('adult') ||
                    genresStr.includes('hentai')
                )) {
                    detectedContentType = 'doujin';
                }
                // Détection manhwa par titre
                else if (detectedContentType === 'manga' && (
                    animeTitle.includes('manhwa') ||
                    animeTitle.includes('solo leveling') ||
                    animeTitle.includes('tower of god') ||
                    animeTitle.includes('noblesse')
                )) {
                    detectedContentType = 'manhwa';
                }
                // Détection manhua par titre
                else if (detectedContentType === 'manga' && animeTitle.includes('manhua')) {
                    detectedContentType = 'manhua';
                }
            }
            
            
            // Récupérer la note existante
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            currentRating = null;
            
            if (user && user.email) {
                const notesKey = 'user_content_notes_' + user.email;
                const deletedNotesKey = 'deleted_content_notes_' + user.email;
                const notes = JSON.parse(localStorage.getItem(notesKey) || '[]');
                const deletedNotes = JSON.parse(localStorage.getItem(deletedNotesKey) || '[]');
                
                
                // Vérifier si cette note est dans la liste des supprimées permanentes (utiliser detectedContentType)
                const isDeleted = deletedNotes.some(deletedNote => 
                    String(deletedNote.id) === String(animeId) && deletedNote.contentType === detectedContentType
                );
                
                if (isDeleted) {
                    // Ne pas bloquer l'affichage, permettre de renoter
                    currentRating = null;
                } else {
                    // Rechercher la note avec le detectedContentType (même logique que saveRating)
                    // Essayer d'abord avec detectedContentType, puis avec contentType si pas trouvé (pour compatibilité)
                    let existingNote = notes.find(n => {
                        const idMatch = String(n.id) === String(animeId);
                        const typeMatch = n.contentType === detectedContentType;
                        return idMatch && typeMatch;
                    });
                    
                    // Si pas trouvé avec detectedContentType, essayer avec contentType (pour compatibilité avec anciennes notes)
                    if (!existingNote && detectedContentType !== contentType) {
                        existingNote = notes.find(n => {
                            const idMatch = String(n.id) === String(animeId);
                            const typeMatch = n.contentType === contentType;
                            return idMatch && typeMatch;
                        });
                    }
                    
                    // Si toujours pas trouvé, chercher par ID uniquement (pour trouver la note peu importe le contentType)
                    // Cela garantit qu'on trouve toujours la note si elle existe
                    if (!existingNote) {
                        existingNote = notes.find(n => String(n.id) === String(animeId));
                        if (existingNote) {
                            // Mettre à jour le contentType de la note pour qu'il corresponde au type détecté
                            // Cela évite les problèmes futurs
                            if (existingNote.contentType !== detectedContentType) {
                                existingNote.contentType = detectedContentType;
                                // Sauvegarder la mise à jour
                                try {
                                    localStorage.setItem(notesKey, JSON.stringify(notes));
                                } catch (e) {
                                    console.error('[ERREUR] Erreur lors de la mise à jour du contentType:', e);
                                }
                            }
                        }
                    }
                    
                if (existingNote) {
                        currentRating = existingNote.note;
                    } else {
                    }
                }
            }
            
            // Afficher la note existante
            if (currentRating) {
                console.log(`Affichage de la note ${currentRating}/10 pour ${animeId}`);
                updateStars(starsContainer, currentRating);
                const yourRatingText = getRatingTranslation('your_rating', 'Votre note :');
                ratingText.textContent = `${yourRatingText} ${currentRating}/10`;
                clearBtn.classList.remove('hidden');
            } else {
                console.log(`Aucune note à afficher pour ${animeId}`);
                // Réinitialiser l'affichage des étoiles
                const stars = starsContainer.querySelectorAll('.star');
                stars.forEach(star => {
                    star.classList.remove('selected', 'hover');
                    star.style.color = '';
                    star.style.transform = '';
                });
                ratingText.textContent = getRatingTranslation('click_to_rate', 'Cliquez sur les étoiles pour noter');
                clearBtn.classList.add('hidden');
            }
            
            // Gestionnaires d'événements pour les étoiles
            const stars = starsContainer.querySelectorAll('.star');
            
            stars.forEach(star => {
                star.addEventListener('mouseenter', function() {
                    const value = parseInt(this.dataset.value);
                    hoveredRating = value;
                    highlightStars(stars, value);
                });
                
                star.addEventListener('mouseleave', function() {
                    // Réinitialiser le survol et restaurer l'affichage original
                    hoveredRating = null;
                    if (currentRating) {
                        highlightStars(stars, currentRating);
                    } else {
                        clearStars(stars);
                    }
                });
                
                // Ajouter un événement mousemove pour un meilleur suivi
                star.addEventListener('mousemove', function() {
                    const value = parseInt(this.dataset.value);
                    hoveredRating = value;
                    highlightStars(stars, value);
                });
                
                star.addEventListener('click', function() {
                    const value = parseInt(this.dataset.value);
                    
                    // Vérifier que contentData est disponible
                    if (!contentData) {
                        console.error('[ERREUR] contentData non disponible au clic, attente...');
                        // Attendre un peu et réessayer
                        setTimeout(async () => {
                            if (contentData) {
                                await saveRating(animeId, value);
                            } else {
                                console.error('[ERREUR] contentData toujours non disponible après attente');
                                alert('Erreur: données du contenu non disponibles. Veuillez recharger la page.');
                            }
                        }, 500);
                        return;
                    }
                    
                    // Sauvegarder la nouvelle note (async)
                    (async () => {
                        try {
                            const result = await saveRating(animeId, value);
                            if (result) {
                                console.log('✅ Note sauvegardée avec succès');
                            } else {
                                console.error('❌ Échec de la sauvegarde de la note');
                                alert('Erreur lors de la sauvegarde de la note. Veuillez réessayer.');
                            }
                        } catch (error) {
                            console.error('❌ Erreur lors de la sauvegarde:', error);
                            alert('Erreur lors de la sauvegarde de la note. Veuillez réessayer.');
                        }
                    })();
                    
                    // Mettre à jour les variables globales
                    currentRating = value;
                    hoveredRating = null;
                    
                    // Mettre à jour l'affichage
                    updateStars(starsContainer, value);
                    const yourRatingText = getRatingTranslation('your_rating', 'Votre note :');
                    ratingText.textContent = `${yourRatingText} ${value}/10`;
                    clearBtn.classList.remove('hidden');
                    
                });
            });
            
            // Gestionnaire pour le bouton d'annulation
            if (clearBtn) {
                clearBtn.addEventListener('click', function() {
                    clearRating(animeId);
                currentRating = null;
                hoveredRating = null; // Réinitialiser la note survolée
                
                // Réinitialiser l'affichage des étoiles
                const starsContainer = document.querySelector('.rating-stars');
                if (starsContainer) {
                    const stars = starsContainer.querySelectorAll('.star');
                    stars.forEach(star => {
                        star.classList.remove('selected', 'hover');
                        star.style.color = '';
                        star.style.transform = '';
                    });
                }
                
                    ratingText.textContent = getRatingTranslation('click_to_rate', 'Cliquez sur les étoiles pour noter');
                    clearBtn.classList.add('hidden');
                });
            }
        }
        
        // Fonction pour mettre en surbrillance les étoiles
        function highlightStars(stars, count) {
            stars.forEach((star, index) => {
                if (index < count) {
                    star.classList.add('hover');
                    star.style.color = '#00b894';
                    star.style.transform = 'scale(1.1)';
                } else {
                    star.classList.remove('hover');
                    star.style.color = '';
                    star.style.transform = '';
                }
            });
            
            // Afficher la note potentielle au survol
            const ratingText = document.querySelector('.rating-text');
            if (ratingText) {
                if (count > 0) {
                    const potentialRatingText = getRatingTranslation('potential_rating', 'Note potentielle :');
                    ratingText.textContent = `${potentialRatingText} ${count}/10`;
                    ratingText.style.color = '#00b894';
                    ratingText.style.fontWeight = '600';
                } else {
                    // Revenir au texte par défaut si aucune étoile survolée
                    if (currentRating) {
                        const yourRatingText = getRatingTranslation('your_rating', 'Votre note :');
                        ratingText.textContent = `${yourRatingText} ${currentRating}/10`;
                        ratingText.style.color = '';
                        ratingText.style.fontWeight = '';
                    } else {
                        ratingText.textContent = getRatingTranslation('click_to_rate', 'Cliquez sur les étoiles pour noter');
                        ratingText.style.color = '';
                        ratingText.style.fontWeight = '';
                    }
                }
            }
        }
        
        // Fonction pour effacer la surbrillance
        function clearStars(stars) {
            stars.forEach(star => {
                star.classList.remove('hover');
                star.style.color = '';
                star.style.transform = '';
            });
            
            // Restaurer le texte de notation original
            const ratingText = document.querySelector('.rating-text');
            if (ratingText) {
                if (currentRating) {
                    const yourRatingText = getRatingTranslation('your_rating', 'Votre note :');
                    ratingText.textContent = `${yourRatingText} ${currentRating}/10`;
                    ratingText.style.color = '';
                    ratingText.style.fontWeight = '';
                } else {
                    ratingText.textContent = getRatingTranslation('click_to_rate', 'Cliquez sur les étoiles pour noter');
                    ratingText.style.color = '';
                    ratingText.style.fontWeight = '';
                }
            }
        }
        
        // Fonction pour mettre à jour l'affichage des étoiles
        function updateStars(starsContainer, rating) {
            console.log(`updateStars appelé avec rating: ${rating}`);
            const stars = starsContainer.querySelectorAll('.star');
            console.log(`Nombre d'étoiles trouvées: ${stars.length}`);
            
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('selected');

        // Limiter la taille des données stockées pour éviter les erreurs de quota localStorage
        function normalizeNoteForStorage(note) {
            const safeGenres = Array.isArray(note.genres) ? note.genres.filter(Boolean).slice(0, 8) : [];
            return {
                ...note,
                titre: (note.titre || '').toString().slice(0, 180),
                synopsis: (note.synopsis || '').toString().slice(0, 700),
                image: (note.image || '').toString().slice(0, 350),
                genres: safeGenres
            };
        }

        function persistNotesSafely(notesKey, notes) {
            const baseList = Array.isArray(notes) ? notes : [];
            const limitedNotes = baseList.length > 400 ? baseList.slice(baseList.length - 400) : baseList;
            const sanitizedNotes = limitedNotes.map(normalizeNoteForStorage);

            try {
                localStorage.setItem(notesKey, JSON.stringify(sanitizedNotes));
                return sanitizedNotes;
            } catch (err) {
                console.error('[ERREUR] Échec de la sauvegarde des notes (tentative 1):', err);

                // Deuxième tentative avec synopsis raccourci au maximum
                const trimmedNotes = sanitizedNotes.map(n => ({
                    ...n,
                    synopsis: (n.synopsis || '').slice(0, 280)
                }));

                try {
                    localStorage.setItem(notesKey, JSON.stringify(trimmedNotes));
                    return trimmedNotes;
                } catch (err2) {
                    console.error('[ERREUR] Échec de la sauvegarde des notes après nettoyage:', err2);

                    // Dernier fallback : ne garder que les données minimales pour ne pas bloquer l'utilisateur
                    const minimalNotes = trimmedNotes.map(n => ({
                        id: n.id,
                        note: n.note,
                        contentType: n.contentType,
                        addedAt: n.addedAt || Date.now()
                    }));

                    try {
                        localStorage.setItem(notesKey, JSON.stringify(minimalNotes));
                        console.warn('[INFO] Sauvegarde réduite aux données minimales pour éviter le quota.');
                        return minimalNotes;
                    } catch (err3) {
                        console.error('[ERREUR] Impossible de sauvegarder même les données minimales:', err3);
                        return null;
                    }
                }
            }
        }
        
        // Fonction pour sauvegarder la note (avec Firebase en priorité)
        async function waitForFirebaseNotesService(maxWaitMs = 3000) {
            if (window.firebaseNotesService) return true;
            const start = Date.now();
            while (!window.firebaseNotesService && (Date.now() - start) < maxWaitMs) {
                await new Promise(resolve => setTimeout(resolve, 120));
            }
            return !!window.firebaseNotesService;
        }

                    detectedContentType = 'roman';

                    detectedContentType = 'film';

                    detectedContentType = 'manga';

            }
            
            // Détection supplémentaire basée sur le titre et les genres si le type API n'est pas spécifique
            const titleLower = animeTitle.toLowerCase();
            const genresStr = genres.join(' ').toLowerCase();
            
            // Si le type détecté est toujours "manga" mais qu'on détecte des indices de doujin
            if (detectedContentType === 'manga' && (

                titleLower.includes('hentai') ||
                genresStr.includes('erotica') ||
                genresStr.includes('adult') ||
                genresStr.includes('hentai')
            )) {
                detectedContentType = 'doujin';
            }
            // Détection manhwa par titre
            else if (detectedContentType === 'manga' && (

                titleLower.includes('solo leveling') ||
                titleLower.includes('tower of god') ||
                titleLower.includes('noblesse')
            )) {
                detectedContentType = 'manhwa';
            }
            // Détection manhua par titre
            else if (detectedContentType === 'manga' && titleLower.includes('manhua')) {
                detectedContentType = 'manhua';
            }
            
            // IMPORTANT: Si le type de l'URL est 'anime', forcer contentType à 'anime'
            // Cela garantit que les anime sont bien sauvegardés avec contentType: 'anime'
            const urlType = urlParams.get('type');
            if (urlType === 'anime' && detectedContentType !== 'film') {

            // Créer l'objet anime complet avec toutes les informations
            const nowTs = Date.now();
            const animeNote = {

                try {

            // Sauvegarder aussi dans localStorage pour synchronisation (même si Firebase a réussi)
            const notesKey = 'user_content_notes_' + user.email;
            let notes = [];

                notes = [];

            // Chercher si l'anime existe déjà avec le contentType détecté
            const existingIndex = notes.findIndex(n => String(n.id) === String(animeId) && n.contentType === detectedContentType);
            
            if (existingIndex !== -1) {
                const originalAddedAt = notes[existingIndex].addedAt;
                notes[existingIndex] = { ...notes[existingIndex], ...animeNote, addedAt: originalAddedAt, updatedAt: nowTs };
                notes[existingIndex].contentType = detectedContentType;
                console.log(`✅ Note mise à jour (localStorage) pour ${detectedContentType} ${animeId}: ${rating}/10`);
            } else {
                const existingWithDifferentType = notes.findIndex(n => String(n.id) === String(animeId) && n.contentType !== detectedContentType);

        async function flushPendingFirebaseNotes() {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (!user || !user.email || !window.firebaseNotesService) return;
            const pendingKey = 'pending_firebase_notes_' + user.email;
            let pending = [];
            try {
                pending = JSON.parse(localStorage.getItem(pendingKey) || '[]');
            } catch (e) {
                pending = [];
            }
            if (!Array.isArray(pending) || pending.length === 0) return;

            const remaining = [];
            for (const note of pending) {
                try {
                    const ok = await window.firebaseNotesService.saveNote(user.email, note);
                    if (!ok) remaining.push(note);
                } catch (e) {
                    remaining.push(note);
                }
            }
            localStorage.setItem(pendingKey, JSON.stringify(remaining));
        }

            const savedState = localStorage.getItem('mangaDatabaseState');
            if (savedState) {
                try {

                    // Vérifier si l'état n'est pas trop ancien (plus de 30 minutes)

            for (const element of titleElements) {

                if (originalText && originalText.length > 0) {

            const synopsisElement = document.querySelector('.synopsis-text');
            if (!synopsisElement) {
                console.log('❌ Élément synopsis non trouvé');
                return;
            }
            
            const originalSynopsis = synopsisElement.getAttribute('data-synopsis');
            if (!originalSynopsis || originalSynopsis.trim() === '') {
                console.log('❌ Synopsis original vide ou manquant');
                return;
            }
            
            // Nettoyer le synopsis avant traduction (supprime seulement les mentions MAL rewrite)
            const cleanedSynopsis = cleanSynopsis(originalSynopsis);
            if (!cleanedSynopsis) {
                console.log('❌ Synopsis nettoyé vide');
                return;
            }
            
            // Vérifier si le synopsis est long (nécessitera une division en segments)
            const isLongSynopsis = cleanedSynopsis.length > 4500;
            console.log(`📝 Traduction du synopsis en ${targetLanguage} (${cleanedSynopsis.length} caractères${isLongSynopsis ? ' - sera divisé en segments' : ''})`);
            
            try {
                // Afficher un indicateur de chargement adapté
                const loadingMessage = isLongSynopsis 
                    ? '<br><small style="color: #666;">🔄 Traduction en cours... (synopsis long, cela peut prendre quelques instants)</small>'
                    : '<br><small style="color: #666;">🔄 Traduction en cours...</small>';
                synopsisElement.innerHTML += loadingMessage;
                
                // translateWithCache gère maintenant automatiquement la division en segments pour les longs textes
                const translatedSynopsis = await translateWithCache(cleanedSynopsis, targetLanguage);
                
                if (translatedSynopsis && translatedSynopsis.trim() !== '' && translatedSynopsis !== cleanedSynopsis) {
                    // Appliquer le nettoyage HTML
                    const processedSynopsis = translatedSynopsis
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    
                    synopsisElement.innerHTML = processedSynopsis;
                    console.log(`✅ Synopsis traduit en ${targetLanguage} (${translatedSynopsis.length} caractères)`);
                } else {

                    synopsisElement.innerHTML = synopsisElement.innerHTML.replace(/<br><small style="color: #666;">.*?<\/small>/, '');
                    console.log('⚠️ Traduction du synopsis identique à l\'original ou vide');

            } catch (error) {
                // Retirer l'indicateur de chargement en cas d'erreur
                synopsisElement.innerHTML = synopsisElement.innerHTML.replace(/<br><small style="color: #666;">.*?<\/small>/, '');
                console.error('❌ Erreur lors de la traduction du synopsis:', error);
            }

    <script>
        // Fonction helper pour obtenir une traduction
        function getTranslation(key, fallback = key) {
            if (window.localization) {
                const translation = window.localization.get(key);
                return translation !== key ? translation : fallback;
            }
            return fallback;
        }

        // Fonction pour obtenir le placeholder traduit selon le type
        function getPlaceholderForType(type) {
            const placeholderKey = `search.placeholder.${type}`;
            const translation = getTranslation(placeholderKey);
            
            // Si la traduction n'existe pas, utiliser la clé générique
            if (translation === placeholderKey) {
                return getTranslation('search.placeholder.generic', 'Rechercher...');
            }
            
            return translation;
        }

        // Fonction pour mettre à jour les options du select
        function updateSelectOptions() {
            const searchType = document.getElementById('searchType');
            if (!searchType) return;
            
            const options = searchType.querySelectorAll('option');
            options.forEach(option => {
                const value = option.value;
                option.textContent = getTranslation('search.type.' + value);
            });
        }

        // Fonction pour mettre à jour le badge de type dans les détails
        function updateDetailsTypeBadge() {
            const typeBadge = document.querySelector('.details-type');
            if (typeBadge) {
                const originalType = typeBadge.getAttribute('data-original-type');
                const contentType = typeBadge.getAttribute('data-content-type') || 'anime';
                
                if (originalType) {
                    typeBadge.textContent = getTranslatedType(contentType, originalType);
                }
            }
        }

        // Gestion du sélecteur de recherche
        document.addEventListener('DOMContentLoaded', function() {
            const searchType = document.getElementById('searchType');
            const searchInput = document.getElementById('searchInput');
            
            if (searchType && searchInput) {
                // Mettre à jour les options du select au chargement
                updateSelectOptions();
                
                const placeholders = {
                    'anime': getPlaceholderForType('anime'),
                    'manga': getPlaceholderForType('manga'),
                    'movie': getPlaceholderForType('movie'),
                    'manhwa': getPlaceholderForType('manhwa'),
                    'manhua': getPlaceholderForType('manhua'),
                    'user': getPlaceholderForType('user')
                };
                
                // Changer le placeholder selon le type sélectionné
                searchType.addEventListener('change', function() {
                    const selectedType = this.value;
                    searchInput.placeholder = placeholders[selectedType] || getTranslation('search.placeholder.generic', 'Rechercher...');
                });
                
                // Initialiser le placeholder au chargement
                searchInput.placeholder = placeholders[searchType.value] || getTranslation('search.placeholder.generic', 'Rechercher...');
                
                // Mettre à jour le placeholder et les options quand la langue change
                document.addEventListener('languageChanged', function() {
                    updateSelectOptions();
                    const updatedPlaceholders = {
                        'anime': getPlaceholderForType('anime'),
                        'manga': getPlaceholderForType('manga'),
                        'movie': getPlaceholderForType('movie'),
                        'manhwa': getPlaceholderForType('manhwa'),
                        'manhua': getPlaceholderForType('manhua'),
                        'user': getPlaceholderForType('user')
                    };
                    searchInput.placeholder = updatedPlaceholders[searchType.value] || getTranslation('search.placeholder.generic', 'Rechercher...');
                    updateDetailsTypeBadge();
                });
            }
        });
    </script>
